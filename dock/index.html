<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
<title>dock.</title>
<style>
@font-face{font-family:"Power Grotesk";src:url("fonts/PowerGrotesk-Light.woff2") format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Power Grotesk";src:url("fonts/PowerGrotesk-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0E0D0C;width:240px;height:282px;overflow:hidden}
body{font-family:"Power Grotesk",-apple-system,Helvetica,Arial,sans-serif;color:#ECEAE3;position:relative;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:absolute;left:0;top:0;width:240px;height:282px;background:#0E0D0C}
#foot{position:absolute;left:12px;right:12px;bottom:7px;display:flex;justify-content:space-between;align-items:flex-end;
  font-size:11px;font-weight:400;line-height:1;pointer-events:none;color:#6E6A62}
#read{position:absolute;left:0;top:0;right:0;bottom:0;background:#0E0D0C;display:none;flex-direction:column;
  justify-content:center;padding:12px;pointer-events:none;z-index:5}
#readBig{font-size:64px;font-weight:300;line-height:.9;letter-spacing:-.01em}
#readTxt{font-size:14px;font-weight:300;line-height:1.3;margin-top:8px;color:#6E6A62}
</style>
</head>
<body>
<canvas id="cv" width="240" height="282"></canvas>
<div id="foot"><span id="capL"></span><span id="capR"></span></div>
<div id="read"><div id="readBig"></div><div id="readTxt"></div></div>

<script>
/* ==================================================================
   dock. — the bedside orb (rabbit r1)
   scroll = move the alarm · tap = read it literally (2s)
   hold   = armed reset to 05:45 · side button = leave

   the orb is what's left of the night; the amber ring is what's gone.
   nothing moves here. the face redraws once a minute and otherwise
   sits still — at 3am stillness is the whole point.

   palette note: this creation departs from the house black-and-cyan
   on purpose. #0E0D0C / bone / amber is warm and low because a
   bedside object is read by a dark-adapted eye. cyan is a slap.
================================================================== */
'use strict';
var PAPER='#0E0D0C', LIT='#ECEAE3', MID='#6E6A62', RULE='#262421', AMBER='#EF9F27';

/* geometry — lifted from the mockup unchanged */
var CX=120, CY=104, R=64, RING=88;
/* the night, in minutes: start -> alarm is 525, the ring runs 45 past */
var NIGHT=525, SPAN=570;
var DEFAULT_ALARM=5*60+45;   /* 05:45 */

var clamp=function(v,a,b){return Math.min(b,Math.max(a,v));};
var pad=function(v){return (v<10?'0':'')+v;};
var lit=function(al){return 'rgba(236,234,227,'+al.toFixed(3)+')';};
var amb=function(al){return 'rgba(239,159,39,'+al.toFixed(3)+')';};
var seg=function(n,a,b,u,v){ if(n<=a)return u; if(n>=b)return v; return u+(v-u)*((n-a)/(b-a)); };
var hhmm=function(m){ m=((m%1440)+1440)%1440; return pad(Math.floor(m/60))+':'+pad(m%60); };

/* ---------- storage ---------- */
function store(key,obj){ try{ localStorage.setItem(key,JSON.stringify(obj)); }catch(e){}
  try{ if(window.creationStorage&&window.creationStorage.plain)
    window.creationStorage.plain.setItem(key,btoa(JSON.stringify(obj))).catch(function(){}); }catch(e){} }
function load(key){ try{ var r=localStorage.getItem(key); return r?JSON.parse(r):null; }catch(e){ return null; } }

/* ---------- sound ---------- */
var AC=null;
function unlockAudio(){ if(AC)return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function tone(f0,f1,dur,g){ if(!AC)return; try{
  var o=AC.createOscillator(),ga=AC.createGain(); o.type='sine';
  o.frequency.setValueAtTime(f0,AC.currentTime); o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),AC.currentTime+dur);
  ga.gain.setValueAtTime(g||.04,AC.currentTime); ga.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
  o.connect(ga); ga.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur+.02);
}catch(e){} }

/* ---------- state ---------- */
var alarm=DEFAULT_ALARM, armed=0, armT=null;
(function restore(){ var r=load('dock_alarm'); if(r&&typeof r.m==='number') alarm=clamp(r.m,0,1439); })();
function saveAlarm(){ store('dock_alarm',{m:alarm}); }

/* where we are in the night.
   n runs 0..SPAN from night-start; outside the window we are simply awake. */
function nowMins(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); }
function phase(){
  var start=((alarm-NIGHT)%1440+1440)%1440;
  var raw=((nowMins()-start)%1440+1440)%1440;
  return { n: raw<=SPAN?raw:SPAN, inNight: raw<=SPAN };
}
function brightness(n){
  if(n<140) return 1;
  if(n<210) return seg(n,140,210,1,.42);
  if(n<=390) return .42;
  if(n<NIGHT) return seg(n,390,NIGHT,.42,1);
  return 1;
}
function lightAngle(n){ return 2.85*(n<300 ? n/300 : Math.max(0,(NIGHT-n)/(NIGHT-300))); }
function phaseName(p){
  if(!p.inNight) return 'awake';
  if(p.n<150) return 'settling';
  if(p.n<390) return 'dark';
  if(p.n<NIGHT) return 'surfacing';
  return 'awake';
}

/* ---------- draw ---------- */
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
(function hidpi(){ var d=window.devicePixelRatio||1; if(d===1)return;
  cv.width=240*d; cv.height=282*d; ctx.scale(d,d); })();

var capL=document.getElementById('capL'), capR=document.getElementById('capR');
var readEl=document.getElementById('read'), readBig=document.getElementById('readBig'), readTxt=document.getElementById('readTxt');
var readTimer=null;
function showRead(big,txt){ readBig.textContent=big||''; readTxt.textContent=txt||'';
  readEl.style.display='flex'; clearTimeout(readTimer);
  readTimer=setTimeout(function(){ readEl.style.display='none'; },2000); }

function drawRing(n,br){
  ctx.clearRect(0,0,240,282);
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,240,282);
  ctx.lineWidth=1; ctx.strokeStyle=RULE;
  ctx.beginPath(); ctx.arc(CX,CY,RING,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle=amb(.2+br*.3); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(CX,CY,RING,-Math.PI/2,-Math.PI/2+Math.PI*2*(n/SPAN)); ctx.stroke();
}
function drawOrb(a,br){
  var k=Math.cos(a);
  ctx.beginPath();
  ctx.arc(CX,CY,R,-Math.PI/2,Math.PI/2,false);
  if(k>=0) ctx.ellipse(CX,CY,R*k,R,0,Math.PI/2,Math.PI*1.5,false);
  else     ctx.ellipse(CX,CY,R*(-k),R,0,Math.PI/2,-Math.PI/2,true);
  ctx.closePath();
  ctx.fillStyle=lit(.94*br+.06); ctx.fill();
}
function drawClock(br){
  ctx.textAlign='center';
  ctx.fillStyle=lit(Math.max(br,.38));
  ctx.font='300 36px "Power Grotesk", -apple-system, Helvetica, Arial, sans-serif';
  ctx.fillText(hhmm(nowMins()),120,250);
}
function paint(){
  var p=phase(), br=brightness(p.n);
  drawRing(p.n,br); drawOrb(lightAngle(p.n),br); drawClock(br);
  capL.textContent = armed ? 'hold again to reset' : phaseName(p);
  capR.textContent = hhmm(alarm);
}

/* ---------- the tick ----------
   once a minute, on the minute. no animation loop: the orb changes
   far too slowly to justify one on this hardware. */
var tickT=null;
function scheduleTick(){ clearTimeout(tickT);
  var ms=60000-(Date.now()%60000)+50;
  tickT=setTimeout(function(){ paint(); scheduleTick(); },ms); }

/* ---------- input ---------- */
function disarm(){ armed=0; clearTimeout(armT); }
function onWheel(d){ unlockAudio(); disarm();
  alarm=((alarm+d*5)%1440+1440)%1440; saveAlarm();
  tone(400,380,.04,.03); paint(); }
function onTap(){ unlockAudio(); disarm();
  var p=phase(); showRead(hhmm(nowMins()), phaseName(p)+' · '+hhmm(alarm)+' alarm');
  tone(520,500,.05,.03); paint(); }
function onHold(){ unlockAudio();
  if(!armed){ armed=1; tone(300,280,.08,.04); paint();
    armT=setTimeout(function(){ armed=0; paint(); },4000); return; }
  disarm(); alarm=DEFAULT_ALARM; saveAlarm(); tone(220,180,.18,.05); paint(); }
function leave(){ try{ closeWebView.postMessage(''); }catch(e){} }

window.addEventListener('scrollUp',   function(){ onWheel(-1); });
window.addEventListener('scrollDown', function(){ onWheel(1); });
window.addEventListener('sideClick',  function(){ leave(); });
var lpFired=false;
window.addEventListener('longPressStart', function(){ lpFired=true; onHold(); });
window.addEventListener('longPressEnd',   function(){ setTimeout(function(){ lpFired=false; },50); });

var pressT=null, longDone=false;
document.body.addEventListener('pointerdown', function(){ unlockAudio(); longDone=false;
  pressT=setTimeout(function(){ longDone=true; onHold(); },600); });
document.body.addEventListener('pointerup', function(){ clearTimeout(pressT);
  if(longDone||lpFired)return; onTap(); });
document.body.addEventListener('pointercancel', function(){ clearTimeout(pressT); });

/* desktop testing: arrows = scroll, enter/click = tap, space = hold, escape = side */
window.addEventListener('wheel', function(e){ onWheel(e.deltaY>0?1:-1); }, {passive:true});
document.addEventListener('keydown', function(e){
  if(e.key==='ArrowUp')   onWheel(-1);
  if(e.key==='ArrowDown') onWheel(1);
  if(e.key==='Enter')     onTap();
  if(e.key===' '&&!e.repeat) onHold();
  if(e.key==='Escape')    leave();
});

paint(); scheduleTick();
</script>
</body>
</html>
