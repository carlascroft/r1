<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
<title>player.</title>
<style>
@font-face{font-family:"Power Grotesk";src:url("fonts/PowerGrotesk-Light.woff2") format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Power Grotesk";src:url("fonts/PowerGrotesk-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;width:240px;height:282px;overflow:hidden}
body{font-family:"Power Grotesk",-apple-system,Helvetica,Arial,sans-serif;color:#C9A6FF;position:relative;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:absolute;left:0;top:0;width:240px;height:282px;background:#000}
#foot{position:absolute;left:12px;right:12px;bottom:7px;display:flex;justify-content:space-between;align-items:flex-end;
  gap:8px;font-size:11px;font-weight:400;line-height:1;pointer-events:none}
#capL{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
#read{position:absolute;left:0;top:0;right:0;bottom:0;background:#000;display:none;flex-direction:column;
  justify-content:center;padding:12px;pointer-events:none;z-index:5}
#readBig{font-size:72px;font-weight:300;line-height:.9;letter-spacing:-.01em}
#readTxt{font-size:14px;font-weight:300;line-height:1.3;margin-top:8px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="foot"><span id="capL"></span><span id="capR"></span></div>
<div id="read"><div id="readBig"></div><div id="readTxt"></div></div>

<script>
/* ==================================================================
   player. — targeted podcast player for the rabbit r1 (240×282)

   feeds → episodes → playing, all on one violet fabric.
   scroll: choose / seek ±30s · tap: open / play–pause
   hold: snip (a lime mark at the playhead, kept)
   side button: back (and out, at the top)

   EDIT THESE TWO THINGS:
   1. PROXY — your cloudflare worker url (see worker.js alongside this file)
   2. FEEDS — your podcasts' RSS urls (a podcast's site usually links its
      RSS; podcastindex.org finds it from the name)
================================================================== */
'use strict';
var PROXY = 'https://rabbit-r1-podcast-player.pages.dev';
var FEEDS = [
  { name:'scaffold',      url:'https://feeds.acast.com/public/shows/scaffold' },
  { name:'99pi',          url:'https://feeds.simplecast.com/BqbsxVfO' },
];

var VIOLET='#C9A6FF', LIME='#D6FF2E', PAPER='#F2F2EE', INK='#000';
var rnd=function(a,b){return a+Math.random()*(b-a);};
var clamp=function(v,a,b){return Math.min(b,Math.max(a,v));};

/* ---------- fabric ---------- */
var PITCH=12, X0=12, Y0=12, CX=18, CY=19, COLS=CX+1, ROWS=CY+1, NN=COLS*ROWS;
var dx=new Float32Array(NN), dy=new Float32Array(NN), vx=new Float32Array(NN), vy=new Float32Array(NN);
var K=80, DAMP=.9, COUP=150, PULL=25;
function idx(i,j){return j*COLS+i;}
function nx(i){return X0+i*PITCH;}
function ny(j){return Y0+j*PITCH;}
function pluck(x,y,r,mag){ for(var j=0;j<ROWS;j++)for(var i=0;i<COLS;i++){
  var ddx=nx(i)-x,ddy=ny(j)-y,d=Math.hypot(ddx,ddy); if(d>r||d<1)continue;
  var f=(1-d/r)*mag/d,n=idx(i,j); vx[n]+=ddx*f; vy[n]+=ddy*f; } }
function agitate(m){ for(var n=0;n<NN;n++){ vx[n]+=rnd(-m,m); vy[n]+=rnd(-m,m); } }
function energy(){ var e=0; for(var n=0;n<NN;n++) e+=vx[n]*vx[n]+vy[n]*vy[n]+dx[n]*dx[n]+dy[n]*dy[n]; return e/NN; }
function update(dt,target){
  var dmp=Math.pow(DAMP,dt*60);
  for(var j=0;j<ROWS;j++)for(var i=0;i<COLS;i++){
    var n=idx(i,j), fx=-K*dx[n], fy=-K*dy[n], ax=0,ay=0,c=0;
    if(i>0){ax+=dx[n-1];ay+=dy[n-1];c++;} if(i<COLS-1){ax+=dx[n+1];ay+=dy[n+1];c++;}
    if(j>0){ax+=dx[n-COLS];ay+=dy[n-COLS];c++;} if(j<ROWS-1){ax+=dx[n+COLS];ay+=dy[n+COLS];c++;}
    fx+=COUP*(ax/c-dx[n]); fy+=COUP*(ay/c-dy[n]);
    if(target){ var t=target(i,j); if(t){ fx+=PULL*(t[0]-dx[n]); fy+=PULL*(t[1]-dy[n]); } }
    vx[n]=(vx[n]+fx*dt)*dmp; vy[n]=(vy[n]+fy*dt)*dmp;
    dx[n]+=vx[n]*dt; dy[n]+=vy[n]*dt;
  }
}
function fillCell(ctx,i,j,col){ if(i<0||j<0||i>=CX||j>=CY)return;
  ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(nx(i)+dx[idx(i,j)],ny(j)+dy[idx(i,j)]);
  ctx.lineTo(nx(i+1)+dx[idx(i+1,j)],ny(j)+dy[idx(i+1,j)]);
  ctx.lineTo(nx(i+1)+dx[idx(i+1,j+1)],ny(j+1)+dy[idx(i+1,j+1)]);
  ctx.lineTo(nx(i)+dx[idx(i,j+1)],ny(j+1)+dy[idx(i,j+1)]);
  ctx.closePath(); ctx.fill(); }
function drawFabric(ctx,col,reveal){
  ctx.strokeStyle=col; ctx.lineWidth=1; ctx.lineJoin='round'; ctx.lineCap='round';
  var total=ROWS+COLS, lim=(reveal==null)?total:Math.floor(reveal*total), li=0, i, j, x, y;
  for(j=0;j<ROWS;j++,li++){ if(li>=lim)return; ctx.beginPath();
    for(i=0;i<COLS;i++){ x=nx(i)+dx[idx(i,j)]; y=ny(j)+dy[idx(i,j)]; i?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.stroke(); }
  for(i=0;i<COLS;i++,li++){ if(li>=lim)return; ctx.beginPath();
    for(j=0;j<ROWS;j++){ x=nx(i)+dx[idx(i,j)]; y=ny(j)+dy[idx(i,j)]; j?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.stroke(); }
}

/* ---------- sound (ui tones only; silent while the episode plays) ---------- */
var AC=null;
function unlockAudio(){ if(AC)return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function tone(f0,f1,dur,g){ if(!AC||playing())return; try{
  var o=AC.createOscillator(),ga=AC.createGain(); o.type='sine';
  o.frequency.setValueAtTime(f0,AC.currentTime); o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),AC.currentTime+dur);
  ga.gain.setValueAtTime(g||.05,AC.currentTime); ga.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
  o.connect(ga); ga.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur+.02);
}catch(e){} }

/* ---------- storage ---------- */
function store(key,obj){ try{ localStorage.setItem(key,JSON.stringify(obj)); }catch(e){}
  try{ if(window.creationStorage&&window.creationStorage.plain)
    window.creationStorage.plain.setItem(key,btoa(JSON.stringify(obj))).catch(function(){}); }catch(e){} }
function load(key){ try{ var r=localStorage.getItem(key); return r?JSON.parse(r):null; }catch(e){ return null; } }
var POS = load('pod_pos')||{};      /* enclosure url → seconds */
var SNIPS = load('pod_snips')||[];  /* {feed, ep, url, t, date} */
var LASTEP = load('pod_last')||null;

/* ---------- feed fetching + parsing ---------- */
var epCache={};  /* feed url → {t, eps:[...]} */
function parseDur(s){ if(!s)return 0; s=String(s).trim();
  if(/^\d+$/.test(s)) return +s;
  var p=s.split(':').map(Number); if(p.some(isNaN))return 0;
  return p.reduce(function(a,v){return a*60+v;},0); }
function textOf(el,tag){ var n=el.getElementsByTagName(tag)[0]; return n?(n.textContent||'').trim():''; }
function nsDur(el){ var ch=el.getElementsByTagName('*');
  for(var i=0;i<ch.length;i++) if(ch[i].localName==='duration') return parseDur(ch[i].textContent);
  return 0; }
function parseFeed(xml){
  var doc=new DOMParser().parseFromString(xml,'text/xml');
  var items=doc.getElementsByTagName('item'), eps=[];
  for(var i=0;i<items.length&&eps.length<10;i++){
    var it=items[i], enc=it.getElementsByTagName('enclosure')[0];
    if(!enc)continue;
    eps.push({ title:textOf(it,'title')||'untitled',
      url:enc.getAttribute('url')||'', dur:nsDur(it),
      date:(textOf(it,'pubDate')||'').slice(0,16) });
  }
  return eps;
}
function fetchFeed(f,cb){
  var c=epCache[f.url];
  if(c&&Date.now()-c.t<30*60000){ cb(c.eps,null); return; }
  if(PROXY.indexOf('PASTE-YOUR-WORKER')>=0){ cb(null,'set proxy url in index.html'); return; }
  fetch(PROXY+encodeURIComponent(f.url))
    .then(function(r){ if(!r.ok)throw new Error(r.status); return r.text(); })
    .then(function(x){ var eps=parseFeed(x);
      if(!eps.length)throw new Error('empty');
      epCache[f.url]={t:Date.now(),eps:eps}; cb(eps,null); })
    .catch(function(e){ cb(null,'feed unreachable'); });
}

/* ---------- audio ---------- */
var audio=new Audio();
audio.preload='none';
var buffering=false;
audio.addEventListener('waiting',function(){ buffering=true; });
audio.addEventListener('stalled',function(){ buffering=true; });
audio.addEventListener('playing',function(){ buffering=false; });
audio.addEventListener('canplay',function(){ buffering=false; });
audio.addEventListener('ended',function(){ savePos(); });
function playing(){ return audio.src && !audio.paused && !audio.ended; }
function savePos(){ if(!cur.ep)return;
  POS[cur.ep.url]=Math.floor(audio.currentTime||0); store('pod_pos',POS);
  store('pod_last',{feed:cur.feed?cur.feed.name:'',ep:cur.ep}); }
setInterval(function(){ if(playing())savePos(); },10000);

/* ---------- state ---------- */
var view='feeds';    /* feeds | eps | play */
var sel=0, eps=[], err=null, loading=false;
var cur={feed:null,ep:null};
var mode='booting', boot=0;

/* ---------- views ---------- */
function feedRows(){ var r=[]; if(LASTEP&&LASTEP.ep) r.push({cont:true,name:'continue',ep:LASTEP.ep});
  FEEDS.forEach(function(f){ r.push(f); }); return r; }
function bandY(i){ return 26+i*36; }

function openFeeds(){ view='feeds'; sel=0; err=null; caps(); }
function openEps(f){ cur.feed=f; view='eps'; sel=0; eps=[]; err=null; loading=true; caps();
  fetchFeed(f,function(list,e){ loading=false; err=e; eps=list||[]; sel=0; caps(); }); }
function openPlay(ep){ cur.ep=ep; view='play';
  if(audio.src!==ep.url){ audio.src=ep.url; audio.currentTime=POS[ep.url]||0; }
  audio.play().catch(function(){});
  buffering=true; pluck(120,126,120,90); caps(); }

/* ---------- captions + read ---------- */
var capL=document.getElementById('capL'), capR=document.getElementById('capR');
var readEl=document.getElementById('read'), readBig=document.getElementById('readBig'), readTxt=document.getElementById('readTxt');
var readTimer=null;
function mmss(s){ s=Math.max(0,Math.round(s||0)); return (s>=3600?Math.floor(s/3600)+':':'')+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function showRead(big,txt){ readBig.textContent=big||''; readBig.style.display=big?'block':'none';
  readTxt.textContent=txt||''; readEl.style.display='flex';
  clearTimeout(readTimer); readTimer=setTimeout(function(){ readEl.style.display='none'; },2000); }
function caps(){
  if(view==='feeds'){ var r=feedRows()[sel];
    capL.textContent=r?(r.cont?'continue \u00b7 '+r.ep.title:r.name):'no feeds';
    capR.textContent = FEEDS.length&&FEEDS[0].url.indexOf('example.com')>=0 ? 'edit FEEDS' : 'tap opens'; return; }
  if(view==='eps'){ capL.textContent=loading?'fetching\u2026':(err?err:(eps[sel]?eps[sel].title:'no episodes'));
    capR.textContent=eps[sel]?eps[sel].date:''; return; }
  /* play */
  capL.textContent = buffering?'buffering':(playing()?cur.ep.title:'paused \u00b7 tap plays');
  capR.textContent = mmss(audio.currentTime);
}
setInterval(function(){ if(view==='play')caps(); },1000);

/* ---------- input ---------- */
function doWheel(d){ unlockAudio(); lastInput=T;
  if(mode!=='live')return;
  if(view==='feeds'){ sel=clamp(sel+d,0,feedRows().length-1); tone(340,340-d*40,.05,.04); caps(); return; }
  if(view==='eps'){ if(eps.length){ sel=clamp(sel+d,0,eps.length-1); tone(340,340-d*40,.05,.04); caps(); } return; }
  /* seek ±30s */
  if(audio.src){ audio.currentTime=clamp((audio.currentTime||0)+d*30,0,audio.duration||1e9);
    pluck(playheadX(),playheadY(),50,60); caps(); } }
function doTap(){ unlockAudio(); lastInput=T;
  if(mode!=='live')return;
  if(view==='feeds'){ var r=feedRows()[sel]; if(!r)return;
    if(r.cont){ cur.feed={name:LASTEP.feed}; openPlay(r.ep); } else openEps(r); return; }
  if(view==='eps'){ if(eps[sel]) openPlay(eps[sel]); return; }
  if(playing()){ audio.pause(); savePos(); } else if(audio.src) audio.play().catch(function(){});
  caps(); }
function doHold(){ unlockAudio(); lastInput=T;
  if(mode!=='live'||view!=='play'||!cur.ep)return;
  var t=Math.floor(audio.currentTime||0);
  SNIPS.push({feed:cur.feed?cur.feed.name:'',ep:cur.ep.title,url:cur.ep.url,t:t,date:new Date().toISOString().slice(0,10)});
  store('pod_snips',SNIPS);
  pluck(playheadX(),playheadY(),90,160); tone(500,900,.15,.06);
  showRead(mmss(t),'snipped \u00b7 '+SNIPS.length+' kept'); }
function doBack(){ lastInput=T;
  if(view==='play'){ savePos(); view='eps'; if(!eps.length&&cur.feed&&cur.feed.url)openEps(cur.feed); caps(); return; }
  if(view==='eps'){ openFeeds(); return; }
  try{ if(window.closeWebView)closeWebView.postMessage(''); }catch(e){} }

window.addEventListener('scrollUp',function(){ doWheel(-1); });
window.addEventListener('scrollDown',function(){ doWheel(1); });
window.addEventListener('sideClick',function(){ doBack(); });
var lpFired=false;
window.addEventListener('longPressStart',function(){ lpFired=true; doHold(); });
window.addEventListener('longPressEnd',function(){ setTimeout(function(){ lpFired=false; },50); });
var pressT=null, longDone=false;
document.body.addEventListener('pointerdown',function(){ unlockAudio(); longDone=false;
  pressT=setTimeout(function(){ longDone=true; doHold(); },600); });
document.body.addEventListener('pointerup',function(){ clearTimeout(pressT);
  if(longDone||lpFired)return; doTap(); });
document.body.addEventListener('pointercancel',function(){ clearTimeout(pressT); });
window.addEventListener('wheel',function(e){ doWheel(e.deltaY>0?1:-1); },{passive:true});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowUp')doWheel(-1);
  if(e.key==='ArrowDown')doWheel(1);
  if(e.key==='Escape')doBack();
  if(e.key===' '&&!e.repeat)doHold();
  if(e.key==='Enter')doTap();
});

/* ---------- playhead geometry ---------- */
function durOf(){ return audio.duration||cur.ep&&cur.ep.dur||1; }
function playCell(){ var f=clamp((audio.currentTime||0)/durOf(),0,1); return Math.min(CX*CY-1,Math.floor(f*CX*CY)); }
function playheadX(){ return X0+(playCell()%CX)*PITCH+6; }
function playheadY(){ return Y0+Math.floor(playCell()/CX)*PITCH+6; }

/* ---------- render ---------- */
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var dpr=window.devicePixelRatio||1; cv.width=240*dpr; cv.height=282*dpr; ctx.scale(dpr,dpr);
var T=0, last=0, lastInput=0, lastDraw=0, FRAME=0;
function frame(now){
  requestAnimationFrame(frame);
  if(now-lastDraw<33)return;
  var dt=Math.min(.05,(now-last)/1000||.033); last=now; lastDraw=now; T+=dt; FRAME++;

  if(mode==='booting'){ boot+=dt*1.4; update(dt,null);
    ctx.fillStyle=INK; ctx.fillRect(0,0,240,282);
    drawFabric(ctx,VIOLET,Math.min(1,boot));
    if(boot>=1){ mode='live'; caps(); } return; }

  var sleeping=(T-lastInput>3)&&energy()<.05&&!playing()&&!buffering&&!loading;
  if(!sleeping||FRAME%30===0){
    if(buffering||loading) agitate(4);
    var target=null;
    if(view==='feeds'||view==='eps'){ var y=bandY(sel);
      target=function(i,j){ var d=ny(j)-y, g=Math.exp(-(d*d)/1400); return [0,(d>0?-1:1)*g*16]; }; }
    else if(playing()){ var px=playheadX(), py=playheadY();
      target=function(i,j){ var ddx=nx(i)-px, ddy=ny(j)-py, d2=ddx*ddx+ddy*ddy, g=Math.exp(-d2/500);
        return [(px-nx(i))*g*1.2,(py-ny(j))*g*1.2]; }; }
    update(dt,target);
  }

  ctx.fillStyle=INK; ctx.fillRect(0,0,240,282);
  if(view==='play'){
    var pc=playCell();
    for(var k=0;k<pc;k++) fillCell(ctx,k%CX,Math.floor(k/CX),VIOLET);
    for(var s2=0;s2<SNIPS.length;s2++){ var sn=SNIPS[s2];
      if(cur.ep&&sn.url===cur.ep.url){ var c=Math.min(CX*CY-1,Math.floor(sn.t/durOf()*CX*CY));
        fillCell(ctx,c%CX,Math.floor(c/CX),LIME); } }
  } else {
    /* band weights: feeds by feed count marks? keep pure bands; a lime tick per band with snips */
    var rows2=(view==='feeds')?feedRows():eps;
    for(var b=0;b<rows2.length&&b<6;b++){ var ry=Math.round((bandY(b)-Y0)/PITCH);
      var w=(view==='eps')?clamp(Math.round((rows2[b].dur||1800)/600),3,CX):(rows2[b].cont?4:10);
      for(var cc=0;cc<w;cc++) fillCell(ctx,cc,ry,VIOLET); }
  }
  drawFabric(ctx,VIOLET,null);
}
caps(); requestAnimationFrame(frame);
</script>
</body>
</html>
