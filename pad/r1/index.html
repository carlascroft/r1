<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
<title>pad.</title>
<style>
/* accent is undecided — one property, no literals elsewhere (docs/open-questions.md) */
:root{--accent:#ff6b1a;--accent-dim:#5c2708;--paper:#e8e6de;--muted:#8a8780;--faint:#3a3733}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;width:240px;height:282px;overflow:hidden}
body{font-family:"Power Grotesk",Inter,-apple-system,Helvetica,Arial,sans-serif;font-weight:300;color:var(--paper);
  position:relative;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.band{position:absolute;left:0;right:0;height:22px;padding:0 8px;display:flex;align-items:center;
  justify-content:space-between;font-size:9px;letter-spacing:.06em}
#top{top:0;color:var(--accent);border-bottom:1px solid var(--accent-dim)}
#top .app{color:var(--muted)}
#bot{bottom:0;color:var(--muted);border-top:1px solid var(--accent-dim)}
#bot .linked{color:var(--accent)}
/* milestone 3: a plain 3×3 of cells so every slot can be pressed. the drawn face is milestone 4. */
#grid{position:absolute;left:0;right:0;top:22px;bottom:22px;display:grid;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.key{border-right:1px solid var(--accent-dim);border-bottom:1px solid var(--accent-dim);padding:5px 6px;
  display:flex;flex-direction:column;justify-content:flex-end}
.key:nth-child(3n){border-right:none}
.key:nth-child(n+7){border-bottom:none}
.key .lab{font-size:9px;line-height:1.15}
.key .sub{font-size:8px;color:var(--muted);letter-spacing:.04em}
.key.empty .lab{color:var(--faint)}
.key.pressed{background:var(--accent)}
.key.pressed .lab,.key.pressed .sub{color:#000}
</style>
</head>
<body>
<div id="top" class="band"><span id="padLab"></span><span class="app" id="appLab"></span></div>
<div id="grid"></div>
<div id="bot" class="band"><span id="reason">connecting</span><span id="state">offline</span></div>

<script>
/* ==================================================================
   pad. — milestone 3: pads from config (rabbit r1)
   the mac decides which pad applies to what is in front and sends it;
   this draws it. tap a cell = press that slot. scroll = next page when
   the pad has more than one. side button = leave.
   the device holds no truth of its own: it draws what it is told.
================================================================== */
'use strict';
var TITLE = 'pad.';   /* placeholder name — the one place the display string lives */

var $padLab = document.getElementById('padLab'), $appLab = document.getElementById('appLab'),
    $state = document.getElementById('state'), $reason = document.getElementById('reason'),
    $grid = document.getElementById('grid');

var pad = null, page = 0, cells = [];

function setStatus(state, reason){
  $state.textContent = state;
  $state.className = state === 'linked' ? 'linked' : '';
  $reason.textContent = reason || '';
}
function setContext(m){ $appLab.textContent = m.name || m.app || ''; }
function setPad(m){ pad = m; page = 0; draw(); }

function build(){
  $grid.innerHTML = '';
  cells = [];
  for (var i = 0; i < 9; i++) {
    var c = document.createElement('div'); c.className = 'key empty';
    var lab = document.createElement('div'); lab.className = 'lab';
    var sub = document.createElement('span'); sub.className = 'sub';
    lab.appendChild(document.createTextNode('')); lab.appendChild(sub);
    c.appendChild(lab); $grid.appendChild(c);
    (function(n, cell){
      /* pointer events only — never touchstart with preventDefault on this webview.
         fires on pointerdown: a control surface should not wait for the finger to lift. */
      cell.addEventListener('pointerdown', function(){ press(n); });
      cell.addEventListener('pointerup', release);
      cell.addEventListener('pointercancel', release);
      cell.addEventListener('pointerleave', release);
    })(i, c);
    cells.push({ el: c, text: lab.firstChild, sub: sub });
  }
}
function draw(){
  var slots = pad ? (pad.pages[page] || []) : [];
  $padLab.textContent = pad ? pad.label : TITLE;
  for (var i = 0; i < 9; i++) {
    var s = slots[i], k = cells[i];
    if (s) { k.text.textContent = s.label; k.sub.textContent = s.hint ? ' ' + s.hint : ''; k.el.className = 'key' + (s.assigned ? '' : ' empty'); }
    else   { k.text.textContent = '—'; k.sub.textContent = ' free'; k.el.className = 'key empty'; }
  }
  var pages = pad ? pad.pages.length : 0;
  $reason.textContent = pages > 1 ? ('page ' + (page + 1) + ' of ' + pages) : $reason.textContent;
}
function handle(m){
  if (m.t === 'status') setStatus(m.state, m.reason);
  else if (m.t === 'context') setContext(m);
  else if (m.t === 'pad') setPad(m);
}

var pressed = -1;
function press(n){
  if (!pad || !ws || ws.readyState !== 1) return;
  var s = (pad.pages[page] || [])[n];
  if (!s || !s.assigned) return;          /* an empty slot stays drawn and does nothing */
  ws.send(JSON.stringify({ t: 'press', pad: pad.id, page: page, slot: n }));
  pressed = n; cells[n].el.classList.add('pressed');
}
function release(){ if (pressed >= 0) { cells[pressed].el.classList.remove('pressed'); pressed = -1; } }
function nextPage(d){
  if (!pad || pad.pages.length < 2) return;
  page = (page + d + pad.pages.length) % pad.pages.length; draw();
}

/* one socket, reopened on drop with a backoff */
var ws = null, backoff = 500;
function connect(){
  setStatus('offline', 'connecting');
  ws = new WebSocket('ws://' + location.host + '/ws');
  ws.onopen = function(){ backoff = 500; setStatus('offline', 'waiting for the mac'); };
  ws.onmessage = function(e){ var m; try { m = JSON.parse(e.data); } catch (err) { return; } handle(m); };
  ws.onclose = function(){
    setStatus('offline', 'no host');
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 8000);
  };
  ws.onerror = function(){ /* onclose follows */ };
}
build(); draw(); connect();

function leave(){ try { closeWebView.postMessage(''); } catch (e) {} }
window.addEventListener('sideClick', leave);
window.addEventListener('scrollDown', function(){ nextPage(1); });
window.addEventListener('scrollUp',   function(){ nextPage(-1); });
/* desktop fallbacks: 1–9 = tap a cell, arrows = scroll, escape = side button */
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape') leave();
  else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') nextPage(1);
  else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') nextPage(-1);
  else if (e.key >= '1' && e.key <= '9') press(e.key - 1);
});
window.addEventListener('keyup', function(e){ if (e.key >= '1' && e.key <= '9') release(); });
</script>
</body>
</html>
